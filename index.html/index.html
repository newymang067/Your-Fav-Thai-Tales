
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เรื่องในดวงใจ</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: sans-serif;
      background: linear-gradient(145deg, #f9e8ed, #f6e9dc, #e8eaf6);
      color: #51414a;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: rgba(255,255,255,0.85);
      padding: 42px 25px;
      border-radius: 28px;
      box-shadow: 0 12px 40px #806b7620;
    }

    .heart {
      font-size: 55px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 34px;
      margin: 10px 0;
      color: #a65e78;
    }

    p {
      line-height: 1.9;
      color: #776873;
    }

    button {
      margin-top: 25px;
      border: none;
      border-radius: 30px;
      padding: 15px 38px;
      background: #b87590;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    footer {
      margin-top: 35px;
      font-size: 12px;
      color: #a99ba2;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="heart">♡</div>

    <h1>เรื่องในดวงใจ</h1>

    <p>
      บางเรื่องราวอาจไม่มีคำตอบที่ถูกหรือผิด<br>
      แต่ทุกคำตอบอาจบอกอะไรบางอย่างเกี่ยวกับตัวเรา
    </p>

    <p>
      พร้อมหรือยังที่จะค้นพบเรื่องราว<br>
      ที่ซ่อนอยู่ในหัวใจของคุณ?
    </p>

    <button onclick="startQuiz()">
      เริ่มต้นการเดินทาง
    </button>

    <footer>
      A little story inside your heart.
    </footer>
  </main>

  <script>
    function startQuiz() {
      alert("ยินดีต้อนรับสู่เรื่องในดวงใจ ♡");
    }
  </script>
</body>
</html>
